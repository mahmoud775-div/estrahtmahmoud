<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>إستراحة  نت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d17;--panel:#141826;--panel2:#0e1220;--ink:#eef1f7;--muted:#9aa3b2;--card:#171a2b;--brand:#9f7aea;--brand2:#f472b6;--accent:#facc15;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box}
html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,Segoe UI,Roboto,Arial}
a{color:inherit;text-decoration:none}
.container{width:min(1220px,100%);margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:50;background:rgba(14,18,32,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{position:relative;display:flex;align-items:center;justify-content:center;padding:12px 0;min-height:48px}
.brand{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;font-weight:900;color:var(--brand);pointer-events:none;user-select:none}
.brand .logo{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--brand2);color:#fff}
.iconbtn{position:absolute;left:16px;top:50%;transform:translateY(-50%);background:#1c2034;border:1px solid var(--line);color:#fff;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{fill:#cdd5e0}
.cats{display:flex;gap:8px;overflow:auto;padding:10px 0 6px;scrollbar-width:thin}
.chip{background:#1c2034;border:1px solid var(--line);color:#fff;padding:8px 12px;border-radius:999px;white-space:nowrap;font-size:13px;cursor:pointer}
.chip.active{background:rgba(124,58,237,.22);border-color:rgba(124,58,237,.4)}
main{padding:10px 0 28px}
.row{margin:12px 0 14px}
.row-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 6px}
.row-title{font-weight:900;margin:0}
.more{color:#cde;display:inline-flex;align-items:center;gap:6px}
.carousel{position:relative}
.track{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth;padding:2px;scrollbar-width:thin;-webkit-overflow-scrolling:touch;cursor:grab}
.track:active{cursor:grabbing}
.arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.35);border:1px solid var(--line);color:#fff;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;z-index:2}
.arrow.left{left:-8px}.arrow.right{right:-8px}
@media(max-width:520px){.arrow{display:none}}
.card{flex:0 0 160px;max-width:160px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.poster{position:relative;aspect-ratio:3/4;background:linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,.02))}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster a.click{position:absolute;inset:0;z-index:1;display:block;cursor:pointer}
.body{padding:10px 10px 6px}
.title{font-weight:800;font-size:12px;line-height:1.5;white-space:normal;overflow:visible;text-overflow:clip;margin:0}
@media(max-width:480px){.title{font-size:11px}}
.ep-badge{position:absolute;top:6px;left:6px;z-index:2;background:linear-gradient(180deg, rgba(27,32,51,.88), rgba(18,21,35,.92));color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:4px 8px;font-size:11px;font-weight:900;box-shadow:0 8px 20px rgba(0,0,0,.35);backdrop-filter:blur(8px)}
.ep-badge .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
.skeleton{position:relative;overflow:hidden;background:#101524;border:1px solid var(--line);border-radius:12px}
.skeleton::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg, transparent, rgba(255,255,255,.05), transparent);transform:translateX(-100%);animation:sh 1.2s infinite}
@keyframes sh{to{transform:translateX(100%)}}
.sk-poster{aspect-ratio:3/4;border-radius:16px}.sk-title{height:12px;margin:8px;border-radius:8px}
.category{display:none}.category.show{display:block}
.cat-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:8px}
.cat-title{margin:0;font-weight:900}
.cat-controls{display:flex;align-items:center;gap:8px}
.cat-grid{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:700px){.cat-grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1040px){.cat-grid{grid-template-columns:repeat(6,1fr)}}
.loadmore{display:flex;justify-content:center;padding:12px}
.details{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:100}
.details.show{display:flex}
.d-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line);background:rgba(14,18,32,.92);backdrop-filter:blur(8px)}
.d-wrap{display:grid;gap:12px;grid-template-columns:1fr;padding:12px;overflow:auto}
@media(min-width:900px){.d-wrap{grid-template-columns:320px 1fr}}
.d-poster{border-radius:14px;overflow:hidden;background:#0e1220;border:1px solid var(--line);max-width:220px;margin:0 auto;position:relative}
.d-poster img{display:block;width:100%;height:auto}
.d-title{font-weight:900;margin:0 0 6px;min-height:20px}
.kv{display:grid;gap:10px;grid-template-columns:repeat(2,1fr);margin:10px 0}
@media(min-width:900px){.kv{grid-template-columns:repeat(3,1fr)}}
.rowkv{display:flex;gap:8px;align-items:center;background:#10162a;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:13px;color:#cfd6df}
.sec-title{display:flex;align-items:center;gap:10px;margin:12px 0 8px;font-weight:900}
.sec-title .bar{width:4px;height:18px;background:var(--accent);border-radius:2px}
.story{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:14px;color:#cfd6df;line-height:2;min-height:80px}
.info-list{display:grid;gap:10px;margin:8px 0 2px}
.info-item{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:12px 14px}
.info-item .k{color:#cfd6df}.info-item .v{color:#eef1f7;font-weight:800}
.actions{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:560px){.actions{grid-template-columns:1fr 1fr}}
.eps{margin-top:10px}
.eps-list{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:560px){.eps-list{grid-template-columns:1fr}}
.ep{display:flex;align-items:center;justify-content:space-between;background:#10162a;border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-weight:800}
.ep.active{background:#3b2a7d;color:#fff}
.player{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:flex-start;justify-content:center;padding:16px;z-index:9999}
.player.show{display:flex}
.player-box{width:min(1100px,100%);background:#0b0b0b;border-radius:12px;overflow:hidden;border:1px solid #222;margin-top:6vh}
.player-head{display:flex;align-items:center;justify-content:space-between;background:#0c0c0c;color:#fff;padding:8px 10px}
.player-body{background:#000;color:#ddd;padding:8px}
.qbar{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0 12px}
.qbtn{background:#10162a;border:1px solid var(--line);color:#fff;padding:6px 10px;border-radius:999px;cursor:pointer;font-size:12px}
.qbtn.active{background:#3b2a7d;border-color:#5b47aa}
video{width:100%;height:auto;background:#000}
.dl{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:16px;z-index:9999}
.dl.show{display:flex}
.dl .box{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.dl header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.dl .list{padding:12px}
.dl a{display:flex;align-items:center;justify-content:space-between;background:#1b2033;border:1px solid var(--line);padding:12px;border-radius:12px;margin:8px 0}
.btn{background:#1b2033;border:1px solid var(--line);color:#fff;padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.primary{background:var(--brand2);color:#fff;border:none}
.s-modal{position:fixed;inset:0;background:rgba(5,8,16,.7);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:10000;padding:16px}
.s-modal.show{display:flex}
.s-box{width:min(600px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.s-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
.s-body{padding:12px}
.s-input{width:100%;background:#1b2033;border:1px solid var(--line);color:#fff;padding:12px 14px;border-radius:12px;outline:none}
#toasts{position:fixed;bottom:16px;right:50%;transform:translateX(50%);display:flex;flex-direction:column;gap:8px;z-index:10001;pointer-events:none;max-width:min(92vw,760px)}
#toasts.anchored{bottom:auto;top:0;left:0;right:auto;transform:none}
.toast{opacity:0;transform:translateY(8px);transition:opacity .25s ease, transform .25s ease, box-shadow .25s ease;background:linear-gradient(180deg, rgba(27,32,51,.9), rgba(18,21,35,.92));backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px 14px;color:#eef1f7;font-weight:800;box-shadow:0 12px 28px rgba(0,0,0,.35)}
.toast.show{opacity:1;transform:translateY(0)}.toast.success{border-color:rgba(34,197,94,.45)}.toast.warn{border-color:rgba(245,158,11,.45)}.toast.err{border-color:rgba(239,68,68,.45)}
.toast .row{display:flex;align-items:center;gap:10px}.toast .ico{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.06);font-size:14px}
.loader{width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* === Watch/Download reference-style buttons === */
.watch__and__download{display:flex;gap:12px;flex-wrap:wrap}
.btton{display:flex;align-items:center;gap:12px;border-radius:16px;padding:12px 14px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#fff;cursor:pointer;transition:transform .12s ease,box-shadow .2s ease,background .25s ease,border-color .25s ease}
.btton .icon{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.08)}
.btton .icon svg{width:22px;height:22px;fill:#fff;stroke:#fff}
.btton .txt{font-weight:900;line-height:1.1}
.btton .txt p{margin:2px 0 0;color:#cfd6df;font-weight:600;font-size:12px}





@media(max-width:480px){
  .btton{padding:10px 12px}
  .btton .icon{width:38px;height:38px}
  .btton .txt{font-size:14px}
  .btton .txt p{font-size:11px}
}


/* === Spacing tweak for details buttons === */
.watch__and__download{ margin-top:16px; gap:16px; }
@media(max-width:480px){
  .watch__and__download{ margin-top:14px; gap:14px; }
}


/* === Center details buttons + equal sizing === */
.watch__and__download{ justify-content:center; }
.watch__and__download .btton{ min-width:220px; text-align:center; }
.watch__and__download .btton .txt{ text-align:center; }
@media(max-width:420px){
  .watch__and__download .btton{ min-width: 46%; }
}


.watch__btn,
.download__btn{
  background: linear-gradient(135deg, #8f7bf6, #f38ab5);
  border: 1px solid rgba(255,255,255,.15);
  box-shadow: 0 8px 22px rgba(143,123,246,.20), 0 4px 12px rgba(0,0,0,.30);
}
.watch__btn .icon,
.download__btn .icon{
  background: rgba(255,255,255,.16);
}
.watch__btn:hover,
.download__btn:hover{
  transform: translateY(-1px);
  box-shadow: 0 12px 30px rgba(143,123,246,.28), 0 6px 14px rgba(0,0,0,.36);
  border-color: rgba(255,255,255,.22);
}
.watch__btn:active,
.download__btn:active{ transform: translateY(0) }


/* === v8.41: softer gradients + stronger bold text === */
.watch__btn,
.download__btn{
  /* أخف بدرجتين تقريبًا */
  background: linear-gradient(135deg, #bdb7fa, #f3c4d6);
  border: 1px solid rgba(255,255,255,.14);
  box-shadow: 0 6px 18px rgba(189,183,250,.16), 0 3px 10px rgba(0,0,0,.28);
}
.watch__btn .icon,
.download__btn .icon{
  background: rgba(255,255,255,.12);
}
.watch__btn:hover,
.download__btn:hover{
  box-shadow: 0 10px 24px rgba(189,183,250,.22), 0 6px 14px rgba(0,0,0,.34);
}

.watch__and__download .btton .txt{ 
  font-weight: 900; 
  letter-spacing: .1px;
}
.watch__and__download .btton .txt p{
  font-weight: 800;  /* كان 600 */
  color: #e9edf5;    /* تفتيح طفيف للنص الفرعي */
}


/* === Story block (block__ti + post__story) === */
.block__ti{
  display:flex;align-items:center;gap:10px;margin:12px 0 8px;font-weight:900;color:#eef1f7
}
.block__ti i{
  display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;
  background:rgba(250,204,21,.15); /* قريب من --accent */
  color:#facc15;
}
.block__ti i::before{
  content:"\275E"; /* decorative quote */
  font-size:16px;line-height:1;
}
.post__story{
  display:block;width:100%;
  padding:15px 15px 10px;
  background:#1a22329c;
  border:1px solid rgba(255,255,255,.08);
  border-radius:var(--radius,16px);
  color:#aaa;line-height:22px
}
.post__story p{margin:0}
.post__story span{
  color:#aaa;transition:.2s;display:inline-block
}
.post__story span.hovered{
  color:#fff;cursor:pointer;transform:scale(1.2);z-index:9
}


/* v8.46U — Safe hide Details section content only */
#details #infoList,
#details .info-list,
#details .info__area { display:none !important; }


/* v8.46U-ratings-off — hide rating block inside details only */
#details .rating,
#details .ratings,
#details .rating-box,
#details .rating-stars,
#details [class*="rating"] {
  display: none !important;
}


/* v8.46W — Episodes skin only (no markup replacement) */
#details #epsList{ margin-top: 8px; }
#details #epsList button.ep{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  width:110px; min-height:88px; margin:5px; cursor:pointer;
  background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.10);
  border-radius:14px; padding:10px 8px; color:#e9eef7; font-weight:800;
  transition:transform .15s ease, background .15s ease, border-color .15s ease;
}
#details #epsList button.ep:hover{ transform:translateY(-1px); border-color:rgba(255,255,255,.18); }
#details #epsList button.ep.active{
  outline:0; background:rgba(250,204,21,.12); border-color:rgba(250,204,21,.5);
}
/* inner parts created by JS decorator */
#details #epsList button.ep .ply__icon{ width:28px; height:28px; display:grid; place-items:center; margin-bottom:6px; }
#details #epsList button.ep .ply__icon svg{ width:100%; height:100%; }
#details #epsList button.ep .epi__num{ font-size:13px; line-height:1.2; color:#e6edf6; text-align:center; }
#details #epsList button.ep .epi__num b{ font-weight:900; margin-inline-start:4px; }

/* Wrap: allow wrapping nicely */
#details #epsList{ display:flex; flex-wrap:wrap; }

</style>

<style>
/* ep-switch + watch alert (minimal, scoped) */
#details .ep-alert{display:flex;align-items:center;gap:8px;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.5);color:#d1fae5;border-radius:12px;padding:8px 10px;margin:10px 0;font-weight:800}
#details .ep-alert .ico{width:20px;height:20px;display:grid;place-items:center;background:rgba(16,185,129,.22);border-radius:6px}
#details .ep-alert .ico svg{width:14px;height:14px}
#details .ep-alert .msg{flex:1 1 auto}
#details .ep-alert.hide{opacity:0;transition:opacity .2s ease}
</style>

</head>
<body>
<header>
  <div class="container top">
    <button id="openSearch" class="iconbtn" aria-label="بحث">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M10 4a6 6 0 1 1 0 12 6 6 0 0 1 0-12zm8.32 12.9 3.39 3.39-1.41 1.41-3.39-3.39A8 8 0 1 1 18 10c0 2.05-.77 3.93-2.03 5.33l.35.35z"/></svg>
    </button>
    <div class="brand">سوا نت <span class="logo">▶</span></div>
  </div>
  <div class="container"><div id="topCats" class="cats" aria-label="الأقسام"></div></div>
</header>

<div id="toasts" aria-live="polite" aria-atomic="true"></div>
<main class="container" id="rowsHost"></main>

<section id="categoryPage" class="category container">
  <div class="cat-head">
    <h3 class="cat-title"><span id="catTitle">القسم</span></h3>
    <div class="cat-controls">
      <button id="catClose" class="btn">رجوع</button>
      <button id="catMore" class="btn">تحميل المزيد</button>
    </div>
  </div>
  <div id="catGrid" class="cat-grid"></div>
  <div class="loadmore"><button id="catMore2" class="btn">تحميل المزيد</button></div>
</section>

<section id="searchPage" class="category container">
  <div class="cat-head">
    <h3 class="cat-title"><span id="sTitle">نتائج البحث</span></h3>
    <div class="cat-controls">
      <button id="sClose" class="btn">رجوع</button>
      <button id="sMore" class="btn">تحميل المزيد</button>
    </div>
  </div>
  <div id="sGrid" class="cat-grid"></div>
  <div class="loadmore"><button id="sMore2" class="btn">تحميل المزيد</button></div>
</section>

<section id="details" class="details" aria-modal="true" role="dialog">
  <div class="d-head">
    <strong id="dTitle" class="d-title">—</strong>
    <button id="dClose" class="btn">إغلاق</button>
  </div>
  <div class="d-wrap container">
    <div>
      <div class="d-poster"><img id="dPoster" alt=""></div>
      
<div class="watch__and__download d__flex gap__20">
  <button id="btnWatch" type="button" class="btton watch__btn">
    <div class="icon">
      <svg viewBox="0 0 277.446 277.446" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M59.488,117.299c-0.504-4.237-2.007-8.171-4.273-11.556l202.992-67.776L247.552,6.051 c-1.549-4.638-6.566-7.141-11.201-5.594L15.54,74.182c-4.635,1.547-7.143,6.563-5.594,11.201l5.225,15.647 c-5.216,4.843-8.488,11.752-8.488,19.415c0,9.924,5.486,18.586,13.582,23.127v125.02c0,4.891,3.967,8.853,8.854,8.853h232.793 c4.885,0,8.852-3.963,8.852-8.853V117.299H59.488z M188.869,26.724l26.875-8.973l-6.467,26.14l-26.875,8.973L188.869,26.724z M122.47,48.893l26.877-8.973l-6.467,26.139l-26.875,8.974L122.47,48.893z M33.181,133.946c-7.442,0-13.498-6.056-13.498-13.5 c0-7.444,6.056-13.5,13.498-13.5c7.444,0,13.5,6.056,13.5,13.5C46.681,127.89,40.625,133.946,33.181,133.946z M56.074,71.062 l26.877-8.973l-6.467,26.14l-26.877,8.974L56.074,71.062z M82.476,147.192H54.142l14.412-22.746h28.334L82.476,147.192z M138.554,124.446h28.334l-14.412,22.746h-28.334L138.554,124.446z M131.599,234.372v-60l47.783,30L131.599,234.372z M222.476,147.192h-28.334l14.412-22.746h28.334L222.476,147.192z"/>
      </svg>
    </div>
    <div class="txt">مشاهدة الان<p>عرض المشغل</p></div>
  </button>
  <button id="btnDownload" type="button" class="btton download__btn">
    <div class="icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 3V16M12 16L16 11.625M12 16L8 11.625" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 21H9C6.17157 21 4.75736 21 3.87868 20.1213C3 19.2426 3 17.8284 3 15M21 15C21 17.8284 21 19.2426 20.1213 20.1213C19.8215 20.4211 19.4594 20.6186 19 20.7487" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="txt">تحميل الان<p>سيرفرات التحميل</p></div>
  </button>
</div>

function jget(url, opt){

    var v = d[keys[i]];
    if (Array.isArray(v)) return v;
    if (v && typeof v === 'object'){
      if (Array.isArray(v.items)) return v.items;
      if (Array.isArray(v.results)) return v.results;
      if (Array.isArray(v.posts)) return v.posts;
      if (Array.isArray(v.data)) return v.data;
    }
  }
  for (var k in d){
    var vv = d[k];
    if (Array.isArray(vv)) return vv;
    if (vv && typeof vv === 'object'){
      var n = extractList(vv);
      if (n.length) return n;
    }
  }
  return [];
}
function apiBrowse(key, page){

}

}

}

}
function looksLikeImage(url){ return /\.(webp|jpe?g|png|avif)(\?|$)/i.test(url||""); }

function isProbablyPerson(o){
  var url = (o && o.url) ? o.url : "";
  var role = (o && o.role) ? o.role : "";
  return /actor|escritor|director/i.test(url) || /Self|Guest|Judge|Host|كاتب|مخرج/i.test(role);
}
function pickPosterStrict(obj){
  var keys = ['poster','poster_url','image_url','thumbnail','thumb','cover','cover_url','image'];

    var v = obj && obj[keys[i]];
    if (v && typeof v === 'string' && !isBadDefault(v)) return v;
  }
  return null;
}
function pickPosterLoose(obj){

}
function normalizeUrl(u){

  return u;
}

    if (obj.post_url) c.push(obj.post_url);

  for (var i=0;i<c.length;i++){
    var u = normalizeUrl(c[i]);
    if (u) return u;

}

  var _set = Element.prototype.setAttribute;
  Element.prototype.setAttribute = function(name, value){
    if (this.tagName === 'IMG') {
      if (name === 'src') value = prox(value);
      else if (name === 'srcset') value = proxSrcset(value);
      else if (name === 'data-src' || name === 'data-original') value = prox(value);
    }
    return _set.call(this, name, value);
  };

  // إعادة تعريف خاصية src للصور (إن أمكن)
  try {
    var d = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
    if (d && d.configurable && typeof d.set === 'function') {
      Object.defineProperty(HTMLImageElement.prototype, 'src', {
        set: function(v){ d.set.call(this, prox(v)); },
        get: d.get,
        configurable: true
      });
    }
  } catch(e) {}

  scan(document);
  new MutationObserver(function(muts){
    muts.forEach(function(m){
      m.addedNodes && m.addedNodes.forEach(function(n){
        if(n.nodeType === 1) scan(n);
      });
    });
  }).observe(document.documentElement, {childList:true, subtree:true});
})();
</script>
